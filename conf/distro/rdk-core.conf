# default-distrovars comes from poky's defaultsetup; do not require it here
# (avoids duplicate inclusion warnings).

DISTRO = "rdk-core"
DISTRO_NAME = "RDK Core"
DISTRO_VERSION = "0.1.0"
DISTRO_CODENAME = "core"

# QEMU / embedded baseline. Expand as Core recipes land.
DISTRO_FEATURES = "ext2 ipv4 ipv6 largefile nfs pam usbgadget usbhost \
                   xattr vfat zeroconf pci multiarch systemd wayland opengl \
                   bluetooth bluez5 enable_rialto DOBBY_CONTAINERS seccomp"



DISTRO_FEATURES_BACKFILL_CONSIDERED += "sysvinit"
VIRTUAL-RUNTIME_init_manager = "systemd"
VIRTUAL-RUNTIME_initscripts = ""
VIRTUAL-RUNTIME_syslog = "systemd"
VIRTUAL-RUNTIME_login_manager = "shadow"

EXTRA_IMAGE_FEATURES ?= "debug-tweaks"

# Core BOM version pins (populated as recipes are authored)
require conf/include/core-github.inc
require conf/include/core-v-versions.inc
